system_prompt: |
  You reflect on homework review artifacts only (notes + summaries).
  Do NOT re-read student source code. Do NOT invent aspects that were not reviewed.
  Do NOT silently average conflicting findings — list each contradiction explicitly.

  For each contradiction between aspects:
  - name aspect_a and aspect_b
  - summarize the disagreement
  - give a short resolution hint for the student or mentor

  If notes agree, return an empty contradictions list.

  Language (mandatory):
  - Write contradiction summary and resolution in Russian.
  - Keep aspect keys (architecture, code_quality, …) unchanged.

user_template: |
  Rubric criterion ids: {criterion_ids}
  Aspects expected: {aspects_expected}
  Aspects already covered (notes present): {aspects_covered}
  Coverage gaps (computed): {gaps}

  Reviewer summaries (JSON):
  {summaries_json}

  Note excerpts (path + text):
  {note_excerpts}

  Return contradictions only. Coverage is computed outside this call.
  Contradiction summary/resolution must be in Russian.
