# Sprint-07 method B: VLM caption (gemini) → e5 (task 05).
config_id: multimodal-b-caption-gemini
comment: "VLM caption google/gemini-2.5-flash → e5"

benchmark_only: false

indexer:
  method: B_caption
  corpus_dir: evals/artifacts/captions/gemini-2.5-flash
  options:
    vlm_model: google/gemini-2.5-flash
    slide_dir: data/multimodal-rag
    caption_max_side: 1536
    caption_concurrency: 3

agent:
  impl: langchain-react
  api_url: ${BACKEND_URL}/api/v1/chat

retrieval:
  backend: qdrant

vector_db:
  engine: qdrant
  server_image: qdrant/qdrant:v1.18.1
  client: qdrant-client==1.18.0
  collection: multimodal_b_gemini
  embedding_model: intfloat/multilingual-e5-large
  chunk_size: 800
  chunk_overlap: 0
  top_k: 5
  langfuse_dataset: multimodal_b_gemini_v001

model:
  provider: openrouter
  name: ${LLM_MODEL}
  temperature: ${LLM_TEMPERATURE}

judge:
  provider: openrouter
  name: ${EVAL_JUDGE_MODEL}
  temperature: ${EVAL_JUDGE_TEMPERATURE}

prompt:
  source: ${PROMPT_SOURCE}
  path: ${SYSTEM_PROMPT_PATH}
  name: ${PROMPT_NAME}
  label: ${PROMPT_LABEL}

datasets:
  s1-text: v001
  s2-chart: v001
  s3-layout: v001
  s4-multi: v001
  s5-unanswerable: v001

extra_evaluators: []
