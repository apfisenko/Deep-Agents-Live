# Sprint-07 method A: Tesseract OCR → e5 (task 04).
config_id: multimodal-a-ocr-tesseract

benchmark_only: false

indexer:
  method: A_ocr_tesseract
  corpus_dir: evals/artifacts/ocr/tesseract
  options:
    slide_dir: data/multimodal-rag
    languages: rus+eng
    preprocess: dark_theme
    ocr_via_docker: true

agent:
  impl: langchain-react
  api_url: ${BACKEND_URL}/api/v1/chat

retrieval:
  backend: qdrant

vector_db:
  engine: qdrant
  server_image: qdrant/qdrant:v1.18.1
  client: qdrant-client==1.18.0
  collection: multimodal_a_tesseract
  embedding_model: intfloat/multilingual-e5-large
  chunk_size: 800
  chunk_overlap: 0
  top_k: 5
  langfuse_dataset: multimodal_a_tesseract_v001

model:
  provider: openrouter
  name: ${LLM_MODEL}
  temperature: ${LLM_TEMPERATURE}

judge:
  provider: openrouter
  name: ${EVAL_JUDGE_MODEL}
  temperature: ${EVAL_JUDGE_TEMPERATURE}

prompt:
  source: file
  path: ${SYSTEM_PROMPT_PATH}
  name: SYSTEM_PROMPT_SEARCH_FALLBACK

datasets:
  s1-text: v001
  s2-chart: v001
  s3-layout: v001
  s4-multi: v001
  s5-unanswerable: v001

extra_evaluators: []
