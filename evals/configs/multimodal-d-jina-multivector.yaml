# Sprint-07 method D: Jina v4 multivector (task 07 placeholder).
config_id: multimodal-d-jina-multivector
comment: "Stub config — indexer implemented in task 07"

benchmark_only: false

indexer:
  method: D_jina_multivector
  corpus_dir: data/multimodal-rag
  options:
    max_side: 768

agent:
  impl: langchain-react
  api_url: ${BACKEND_URL}/api/v1/chat

retrieval:
  backend: qdrant

vector_db:
  engine: qdrant
  server_image: qdrant/qdrant:v1.18.1
  client: qdrant-client==1.18.0
  collection: multimodal_d_jina
  embedding_model: jina-embeddings-v4
  chunk_size: 800
  chunk_overlap: 0
  top_k: 5
  langfuse_dataset: multimodal_d_jina_v001

model:
  provider: openrouter
  name: ${LLM_MODEL}
  temperature: ${LLM_TEMPERATURE}

judge:
  provider: openrouter
  name: ${EVAL_JUDGE_MODEL}
  temperature: ${EVAL_JUDGE_TEMPERATURE}

prompt:
  source: file
  path: ${SYSTEM_PROMPT_PATH}
  name: SYSTEM_PROMPT_SEARCH_FALLBACK

datasets:
  s1-text: v001
  s2-chart: v001
  s3-layout: v001
  s4-multi: v001
  s5-unanswerable: v001

extra_evaluators: []
