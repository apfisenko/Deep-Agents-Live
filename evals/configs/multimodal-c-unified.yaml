# Sprint-07 method C: unified VL embed (OpenRouter).
config_id: multimodal-c-unified
comment: "Method C — unified image-embed, one vector per slide"

benchmark_only: false

indexer:
  method: C_unified
  corpus_dir: data/multimodal-rag
  options:
    embed_model: nvidia/llama-nemotron-embed-vl-1b-v2:free
    max_side: 1536

agent:
  impl: langchain-react
  api_url: ${BACKEND_URL}/api/v1/chat

retrieval:
  backend: qdrant

vector_db:
  engine: qdrant
  server_image: qdrant/qdrant:v1.18.1
  client: qdrant-client==1.18.0
  collection: multimodal_c_unified
  embedding_model: nvidia/llama-nemotron-embed-vl-1b-v2:free
  chunk_size: 800
  chunk_overlap: 0
  top_k: 5
  langfuse_dataset: multimodal_c_unified_v001

model:
  provider: openrouter
  name: ${LLM_MODEL}
  temperature: ${LLM_TEMPERATURE}

judge:
  provider: openrouter
  name: ${EVAL_JUDGE_MODEL}
  temperature: ${EVAL_JUDGE_TEMPERATURE}

prompt:
  source: file
  path: ${SYSTEM_PROMPT_PATH}
  name: SYSTEM_PROMPT_SEARCH_FALLBACK

datasets:
  s1-text: v001
  s2-chart: v001
  s3-layout: v001
  s4-multi: v001
  s5-unanswerable: v001

extra_evaluators: []
