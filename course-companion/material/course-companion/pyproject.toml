[project]
name = "course-companion"
version = "0.1.0"
description = "Course Companion — общий диалоговый агент студента курса (практика Темы 11)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ai-homework-mentor",
    "deepagents==0.6.12",
    "langgraph==1.2.8",
    "langchain==1.3.12",
    "langchain-openai==1.3.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    # drill-модуль (companion/drill, ступень 4): генерация A2UI-форм и
    # доставка ответа студента; пины жёсткие — A2UI-экосистема ломается
    # между минорами (см. «Грабли версий» в companion/drill/README.md)
    "a2ui-agent-sdk==0.4.0",
    "fastapi>=0.139.0",
    "langgraph-sdk==0.4.2",
    "openai>=2.45.0",
]

[project.scripts]
companion = "companion.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",  # тесты drill-модуля (companion/drill/tests)
    "httpx>=0.28",
    "ruff>=0.15.20",
    # Agent Server (langgraph dev) — dev-инструмент, не зависимость агента
    "langgraph-cli[inmem]==0.4.30",
    "langgraph-api==0.10.1",  # пин: поведение сервера проверено на этой версии
]

[tool.uv.sources]
ai-homework-mentor = { path = "vendor/ai-homework-mentor", editable = true }

[tool.pytest.ini_options]
# вендор заморожен — его тесты не наши; тесты drill-модуля
# гоняются вместе с корневыми
testpaths = ["tests", "companion/drill/tests"]
asyncio_mode = "auto"  # async-тесты drill-модуля (pytest-asyncio)

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# checker_service — второй пакет той же кодовой базы, но отдельная
# деплой-единица (свой граф/конфиг/порт); граница сервисов = граница деплоя.
packages = ["companion", "checker_service"]
