# Dev-only стенд drill-модуля (фаза 2C). НЕ зависимости продукта:
# python-зависимости самого модуля при интеграции (фаза 3) добавляются
# в корневой pyproject course-companion — см. README модуля.
[project]
name = "drill-devstand"
version = "0.1.0"
description = "Мини-стенд A2UI drill-модуля: сервер :8123 + тесты (dev-only)"
requires-python = ">=3.12"
dependencies = [
    # пины — из _design.md §6 / отчёта спайка 2
    "a2ui-agent-sdk==0.4.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "openai>=2.45.0",
    "langgraph-sdk==0.4.2",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
]

[tool.uv]
package = false
